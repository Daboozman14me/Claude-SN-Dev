# Deploys this Fluent application to a ServiceNow DEV or TEST instance. Manual
# only: nothing runs on push. The person running it names the target instance
# twice, and the job confirms the instance's own name before installing.
#
# Not for production: production goes through ServiceNow's application
# promotion (App Repo / guided install), per the Now SDK CI guidance.
#
# One-time setup per target instance (repo Settings > Environments):
#   - create an environment named exactly as the instance (e.g. dev292961)
#   - add environment secrets SN_USERNAME and SN_PASSWORD for a human-type
#     account with the admin role (or, to use OAuth client credentials, set
#     environment variable SN_AUTH_TYPE=oauth and secrets SN_OAUTH_CLIENT_ID /
#     SN_OAUTH_CLIENT_SECRET; see `now-sdk explain ci-integration`)
#   - optionally add required reviewers so every deploy needs an approval click
name: Deploy to ServiceNow

on:
  workflow_dispatch:
    inputs:
      instance:
        description: "Target instance name, e.g. dev292961 (no default on purpose)"
        required: true
        type: string
      confirm_instance:
        description: "Type the instance name again to confirm"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.instance }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.instance }}
    env:
      INSTANCE: ${{ inputs.instance }}
      CONFIRM: ${{ inputs.confirm_instance }}
    steps:
      - name: Check the target instance was confirmed
        run: |
          if ! printf '%s' "$INSTANCE" | grep -Eq '^[a-z0-9][a-z0-9-]{1,62}$'; then
            echo "::error::'$INSTANCE' is not a valid instance name."; exit 1
          fi
          if [ "$INSTANCE" != "$CONFIRM" ]; then
            echo "::error::The two instance names do not match; nothing was deployed."; exit 1
          fi
          echo "Target: https://$INSTANCE.service-now.com"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The lockfile was resolved through the corporate npm proxy, which GitHub's
      # runners cannot reach. It mirrors public npm, and the lockfile's integrity
      # hashes still require byte-identical packages.
      - name: Point the lockfile at the public npm registry
        run: sed -i 's#https://jfrog.accenturefederaldev.com/artifactory/api/npm/afs-npm-proxy/#https://registry.npmjs.org/#g' package-lock.json

      - run: npm ci

      # Fails if keys.ts is not committed and current; otherwise an install could
      # create duplicate records instead of updating existing ones.
      - run: npx now-sdk build --frozenKeys

      - name: Confirm the credentials reach the intended instance
        env:
          SN_USERNAME: ${{ secrets.SN_USERNAME }}
          SN_PASSWORD: ${{ secrets.SN_PASSWORD }}
          SN_AUTH_TYPE: ${{ vars.SN_AUTH_TYPE }}
        run: |
          if [ "$SN_AUTH_TYPE" = "oauth" ]; then
            echo "OAuth configured; the install step authenticates and the URL below is the only target."
            exit 0
          fi
          actual=$(curl --silent --show-error --fail --user "$SN_USERNAME:$SN_PASSWORD" \
            -H "Accept: application/json" \
            "https://$INSTANCE.service-now.com/api/now/table/sys_properties?sysparm_query=name%3Dinstance_name&sysparm_fields=value&sysparm_limit=1" \
            | jq -r '.result[0].value // empty')
          if [ "$actual" != "$INSTANCE" ]; then
            echo "::error::Credentials reach instance '$actual', not '$INSTANCE'; nothing was deployed."; exit 1
          fi
          echo "Confirmed instance: $actual"

      - name: Install
        env:
          SN_SDK_NODE_ENV: SN_SDK_CI_INSTALL
          SN_SDK_AUTH_TYPE: ${{ vars.SN_AUTH_TYPE || 'basic' }}
          SN_SDK_USER: ${{ secrets.SN_USERNAME }}
          SN_SDK_USER_PWD: ${{ secrets.SN_PASSWORD }}
          SN_SDK_OAUTH_CLIENT_ID: ${{ secrets.SN_OAUTH_CLIENT_ID }}
          SN_SDK_OAUTH_CLIENT_SECRET: ${{ secrets.SN_OAUTH_CLIENT_SECRET }}
        run: SN_SDK_INSTANCE_URL="https://$INSTANCE.service-now.com" npx now-sdk install
